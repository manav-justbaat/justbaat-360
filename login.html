<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — 360° Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    /* Login page is always light mode */
    body { background: #f4f6fb; color: #0d1117; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 18px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }

    .login-logo {
      display: block;
      height: 44px;
      width: auto;
      margin: 0 auto 2rem;
    }

    .login-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #0d1117;
      text-align: center;
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }

    .login-sub {
      font-size: 0.88rem;
      color: #6b7a8d;
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.45rem;
      letter-spacing: 0.01em;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(0,0,0,0.13);
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.95rem;
      color: #0d1117;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .field input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
      background: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59,130,246,0.25);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .error-msg.show { display: block; }

    .lockout-msg {
      display: none;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .lockout-msg.show { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <img class="login-logo" src="logo-light.png" alt="360 Platform" onerror="this.style.display='none'">

    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub">Sign in to the 360° Platform</p>

    <div class="lockout-msg" id="lockoutMsg">
      ⏳ Too many failed attempts. Try again in <strong id="lockoutTimer">—</strong>.
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@justbaat.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="submitBtn">Sign In →</button>
    </form>

    <p class="login-footer">360° Platform · JustBaat Media</p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  (function () {
    // If already authenticated, skip login
    if (Auth.isAuthenticated()) {
      const next = new URLSearchParams(window.location.search).get('next');
      window.location.replace(next || 'index.html');
      return;
    }

    const form       = document.getElementById('loginForm');
    const emailEl    = document.getElementById('email');
    const passEl     = document.getElementById('password');
    const submitBtn  = document.getElementById('submitBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const lockoutMsg = document.getElementById('lockoutMsg');
    const lockoutTimer = document.getElementById('lockoutTimer');

    let countdownInterval = null;

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      lockoutMsg.classList.remove('show');
    }

    function showLockout(ms) {
      errorMsg.classList.remove('show');
      lockoutMsg.classList.add('show');
      submitBtn.disabled = true;
      emailEl.disabled   = true;
      passEl.disabled    = true;

      function tick() {
        const remaining = ms - (Date.now() - startTime);
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          lockoutMsg.classList.remove('show');
          submitBtn.disabled = false;
          emailEl.disabled   = false;
          passEl.disabled    = false;
          passEl.value       = '';
          return;
        }
        const m = Math.floor(remaining / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        lockoutTimer.textContent = m + ':' + String(s).padStart(2, '0');
      }

      const startTime = Date.now();
      clearInterval(countdownInterval);
      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    // Check on load if already locked out
    (function checkInitialLockout() {
      const stored = JSON.parse(localStorage.getItem('360_rate') || '{}');
      const remaining = (stored.lockedUntil || 0) - Date.now();
      if (remaining > 0) showLockout(remaining);
    })();

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorMsg.classList.remove('show');

      const email    = emailEl.value.trim();
      const password = passEl.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      submitBtn.disabled  = true;
      submitBtn.textContent = 'Signing in…';

      const result = await Auth.login(email, password);

      if (result.ok) {
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.replace(next || 'index.html');
      } else if (result.lockoutMs) {
        showLockout(result.lockoutMs);
        submitBtn.textContent = 'Sign In →';
      } else {
        showError(result.error || 'Sign in failed.');
        submitBtn.disabled   = false;
        submitBtn.textContent = 'Sign In →';
        passEl.value = '';
        passEl.focus();
      }
    });
  })();
</script>
</body>
</html>
